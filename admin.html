
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adega de Moc - Administração</title>

    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

    <nav class="navegacao">
        <a href="index.html" class="nav-btn">🏠 Início da Loja</a>
        <a href="admin.html" class="nav-btn ativo">⚙️ Administração</a>
    </nav>

    <h1>Administração - Adega de Moc</h1>

    <form id="formCadastro">

        <div>
            <label for="nome">Nome do Produto</label>
            <input type="text" id="nome" required>
        </div>

        <div>
            <label for="preco">Preço do Produto</label>
            <input
                type="text"
                id="preco"
                placeholder="Ex.: 12,90"
                required
            >
        </div>

        <div>
            <label for="categoria">Categoria do Produto</label>
            <input type="text" id="categoria" required>
        </div>

        <div class="campo-imagem">
            <label for="imagemProduto">Foto do Produto</label>

            <input
                type="file"
                id="imagemProduto"
                accept="image/*"
            >

            <div class="preview-container">
                <img
                    id="previewImagem"
                    alt="Pré-visualização do produto"
                    style="display: none;"
                >

                <p id="textoPreview">
                    Selecione uma foto para visualizar.
                </p>
            </div>
        </div>

        <button type="reset">Limpar</button>
        <button type="submit">Salvar Produto</button>

    </form>

    <h2 class="titulo-tabela">Produtos Cadastrados</h2>

    <div class="tabela-container">

        <table id="tabelaProdutos">

            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="itens"></tbody>

        </table>

    </div>

    <script src="assets/js/scriptAdmin.js"></script>

</body>
</html>
