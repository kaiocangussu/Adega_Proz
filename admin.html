
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Adega de Moc - Administração</title>

    <!-- Link do CSS Admin -->
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <nav class="navegacao">
    <a href="index.html" class="nav-btn">🏠 Início da Loja</a>
    <a href="admin.html" class="nav-btn ativo">⚙️ Administração</a>
</nav>
    <h1>Administração - Adega de Moc</h1>

    <form id="formCadastro">
        <div>
            <label for="nome">Nome do Produto</label>
            <input type="text" id="nome" required>
        </div>

        <div>
            <label for="preco">Preço do Produto</label>
            <input type="text" id="preco" required>
        </div>

        <div>
            <label for="categoria">Categoria do Produto</label>
            <input type="text" id="categoria" required>
        </div>

        <button type="reset">Limpar</button>
        <button type="submit">Enviar</button>
    </form>

    
<h2 class="titulo-tabela">Produtos Cadastrados</h2>

<div class="tabela-container">
    <table id="tabelaProdutos">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Categoria</th>
                <th>Ação</th>
            </tr>
        </thead>

        <tbody id="itens">
            <tr>
                <td>Vinho Exemplo</td>
                <td>R$ 49,90</td>
                <td>Vinhos</td>
                <td>
                    <button type="button" class="btn-excluir">Excluir</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>


    <script src="assets/js/scriptAdmin.js"></script>

</body>
</html>
